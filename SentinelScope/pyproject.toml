[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelscope"
version = "1.0.0"
description = "Offline log triage and IOC matching for blue-team practice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sushant Singh" }]
dependencies = []

[project.scripts]
sentinelscope = "sentinelscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

